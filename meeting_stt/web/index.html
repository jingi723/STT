<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>meeting_stt 대시보드</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --line:#2b3440; --fg:#e6edf3; --muted:#8b98a5; --accent:#3fb950; --rec:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; margin:0; }
  .sub { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns:340px 1fr; gap:0; height:calc(100vh - 57px); }
  .left { border-right:1px solid var(--line); padding:20px; overflow:auto; }
  .right { padding:20px; overflow:auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  select, input[type=text], input[type=number] { width:100%; padding:8px; background:#0d1117; color:var(--fg); border:1px solid var(--line); border-radius:6px; font-size:14px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  button { padding:9px 14px; border:none; border-radius:7px; font-size:14px; cursor:pointer; font-weight:600; }
  button.primary { background:var(--accent); color:#05140a; }
  button.rec { background:var(--rec); color:#fff; }
  button.ghost { background:#0d1117; color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .badge { display:inline-block; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:600; }
  .badge.idle { background:#21262d; color:var(--muted); }
  .badge.live { background:var(--rec); color:#fff; }
  .badge.busy { background:#9e6a03; color:#fff; }
  .hint { font-size:12px; color:var(--muted); line-height:1.5; margin-top:8px; }
  pre { white-space:pre-wrap; word-break:break-word; background:#0d1117; border:1px solid var(--line); border-radius:8px; padding:14px; font-size:13px; line-height:1.55; max-height:55vh; overflow:auto; }
  .err { color:var(--rec); font-size:13px; margin-top:8px; white-space:pre-wrap; }
  h3 { margin:0 0 6px; font-size:14px; }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .checkbox-row input { width:auto; }
  .checkbox-row label { margin:0; }
</style>
</head>
<body>
<header>
  <h1>🎙️ meeting_stt</h1>
  <span class="sub">로컬 ASR(Qwen3-ASR) · 화자분리(pyannote) · LLM-Wiki 회의록</span>
  <span id="status" class="badge idle" style="margin-left:auto;">대기</span>
</header>
<main>
  <section class="left">
    <div class="panel">
      <h3>1. 입력 소스</h3>
      <label>소스 종류</label>
      <select id="sourceType" onchange="onSourceChange()">
        <option value="device">🎙️ 마이크 / 입력 장치</option>
        <option value="app">🖥️ 앱 오디오 (특정 앱 소리)</option>
      </select>

      <div id="deviceBlock">
        <label>입력 장치</label>
        <div class="row">
          <select id="device"></select>
          <button class="ghost" style="flex:0 0 auto;" onclick="loadDevices()">↻</button>
        </div>
      </div>

      <div id="appBlock" style="display:none;">
        <label>앱 선택 (소리 내는 앱)</label>
        <div class="row">
          <select id="app"></select>
          <button class="ghost" style="flex:0 0 auto;" onclick="loadApps()">↻</button>
        </div>
        <p class="hint" id="appHint">웹미팅(Zoom/Meet 등)을 선택하면 그 앱 소리만 녹음됩니다. 들으면서 녹음돼요(라우팅 불필요).</p>
      </div>
    </div>

    <div class="panel">
      <h3>2. 녹음</h3>
      <div class="row">
        <button id="btnRec" class="rec" onclick="startRec()">● 녹음 시작</button>
        <button id="btnStop" class="ghost" onclick="stopRec()" disabled>■ 정지</button>
      </div>
      <p class="hint">녹음 경과: <span id="elapsed">0:00:00</span></p>
    </div>

    <div class="panel">
      <h3>3. 전사 옵션</h3>
      <label>context 키워드 (쉼표 구분)</label>
      <input id="context" type="text" placeholder="LLM-Wiki, Qwen3-ASR, 김상규" />
      <div class="row">
        <div>
          <label>화자 수 (선택)</label>
          <input id="numSpk" type="number" min="1" placeholder="자동" />
        </div>
        <div>
          <label>프로젝트</label>
          <input id="project" type="text" placeholder="My-app" />
        </div>
      </div>
      <div class="checkbox-row">
        <input id="diarize" type="checkbox" checked />
        <label for="diarize">화자분리 사용</label>
      </div>
      <button class="primary" style="width:100%;margin-top:14px;" id="btnTrans" onclick="transcribe()" disabled>전사 실행 ▶</button>
      <p class="hint">정지하면 마지막 녹음을 자동으로 전사 대상에 올립니다. CPU 환경은 다소 시간이 걸립니다.</p>
    </div>
  </section>

  <section class="right">
    <div class="panel">
      <h3>전사 결과 (화자 귀속)</h3>
      <pre id="transcript">아직 결과가 없습니다.</pre>
    </div>
    <div class="panel">
      <h3>회의록</h3>
      <div class="row" style="margin-bottom:10px;">
        <button class="ghost" id="btnNotes" onclick="makeNotes(false)" disabled>로컬 회의록 생성</button>
        <button class="ghost" id="btnPrompt" onclick="makeNotes(true)" disabled>AI 요약 프롬프트 생성</button>
      </div>
      <pre id="notes">전사 후 생성할 수 있습니다.</pre>
    </div>
    <div id="error" class="err"></div>
  </section>
</main>

<script>
let lastWav = null;        // 정지 후 wav 경로
let lastTranscriptJson = null;
let timer = null, startMs = null;

function showErr(msg){ document.getElementById('error').textContent = msg ? ('⚠ ' + msg) : ''; }
function setStatus(text, cls){ const s=document.getElementById('status'); s.textContent=text; s.className='badge '+cls; }

function hms(sec){ sec=Math.round(sec||0); const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60; return h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

async function api(path, opts){
  const r = await fetch(path, opts);
  const data = await r.json().catch(()=>({}));
  if(!r.ok){ throw new Error(data.detail || (r.status+' '+r.statusText)); }
  return data;
}

function sourceType(){ return document.getElementById('sourceType').value; }

function onSourceChange(){
  const isApp = sourceType()==='app';
  document.getElementById('deviceBlock').style.display = isApp ? 'none' : 'block';
  document.getElementById('appBlock').style.display = isApp ? 'block' : 'none';
  if(isApp) loadApps();
}

async function loadDevices(){
  showErr('');
  try{
    const {devices} = await api('/api/devices');
    const sel = document.getElementById('device');
    sel.innerHTML = '';
    if(!devices.length){ sel.innerHTML = '<option>입력 장치 없음</option>'; return; }
    for(const d of devices){
      const o = document.createElement('option');
      o.value = d.index;
      o.textContent = `[${d.index}] ${d.name} (${d.channels}ch, ${d.default_samplerate}Hz)`;
      sel.appendChild(o);
    }
  }catch(e){ showErr('장치 목록 실패: '+e.message); }
}

async function loadApps(){
  showErr('');
  try{
    const {available, sources} = await api('/api/app-sources');
    const sel = document.getElementById('app');
    sel.innerHTML = '';
    if(!available){
      sel.innerHTML = '<option>헬퍼 미빌드</option>';
      document.getElementById('appHint').textContent = '앱별 캡처 헬퍼(native/apptap)가 없습니다. 빌드 후 사용하세요.';
      return;
    }
    if(!sources.length){ sel.innerHTML = '<option>앱 없음</option>'; return; }
    for(const s of sources){
      const o = document.createElement('option');
      o.value = s.pid;
      o.textContent = `${s.name} (pid ${s.pid})`;
      sel.appendChild(o);
    }
  }catch(e){ showErr('앱 목록 실패: '+e.message); }
}

function tick(){ document.getElementById('elapsed').textContent = hms((Date.now()-startMs)/1000); }

async function startRec(){
  showErr('');
  const src = sourceType();
  const body = src==='app'
    ? {source:'app', pid: parseInt(document.getElementById('app').value)}
    : {source:'device', device: parseInt(document.getElementById('device').value)};
  try{
    await api('/api/record/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    document.getElementById('btnRec').disabled = true;
    document.getElementById('btnStop').disabled = false;
    setStatus('녹음 중', 'live');
    startMs = Date.now(); timer = setInterval(tick, 500);
  }catch(e){ showErr('녹음 시작 실패: '+e.message); }
}

async function stopRec(){
  try{
    const {path, duration_sec} = await api('/api/record/stop', {method:'POST'});
    clearInterval(timer);
    lastWav = path;
    document.getElementById('btnRec').disabled = false;
    document.getElementById('btnStop').disabled = true;
    document.getElementById('btnTrans').disabled = false;
    setStatus('녹음 완료 ('+hms(duration_sec)+')', 'idle');
  }catch(e){ showErr('정지 실패: '+e.message); }
}

async function transcribe(){
  if(!lastWav){ showErr('녹음 파일이 없습니다.'); return; }
  showErr('');
  setStatus('전사 중…', 'busy');
  document.getElementById('btnTrans').disabled = true;
  const body = {
    path: lastWav,
    context: document.getElementById('context').value || null,
    num_speakers: parseInt(document.getElementById('numSpk').value) || null,
    diarize: document.getElementById('diarize').checked,
    project: document.getElementById('project').value || null,
  };
  try{
    const data = await api('/api/transcribe', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    lastTranscriptJson = data._json_path;
    const lines = (data.segments||[]).map(s=>`[${s.speaker}] ${hms(s.start)}~${hms(s.end)}: ${s.text}`);
    document.getElementById('transcript').textContent = lines.join('\n') || '(빈 결과)';
    document.getElementById('btnNotes').disabled = false;
    document.getElementById('btnPrompt').disabled = false;
    setStatus('전사 완료', 'idle');
  }catch(e){ showErr('전사 실패: '+e.message); setStatus('오류', 'idle'); }
  finally{ document.getElementById('btnTrans').disabled = false; }
}

async function makeNotes(promptOnly){
  if(!lastTranscriptJson){ showErr('전사 결과가 없습니다.'); return; }
  showErr('');
  try{
    const data = await api('/api/notes', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({transcript_json:lastTranscriptJson, project:document.getElementById('project').value||null, prompt_only:promptOnly})});
    document.getElementById('notes').textContent = data.content;
  }catch(e){ showErr('회의록 생성 실패: '+e.message); }
}

loadDevices();
</script>
</body>
</html>
